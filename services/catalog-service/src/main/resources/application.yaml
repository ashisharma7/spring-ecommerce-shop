server:
  port: 8081

spring:
  application:
    name: Catalog-Service

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/catalog_db}
    username: ${DB_USERNAME:catalog_user}
    password: ${DB_PASSWORD:catalog_pass}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          time_zone: UTC

  jackson:
    time-zone: UTC
    write-dates-as-timestamps: false